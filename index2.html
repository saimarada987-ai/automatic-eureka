<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday</title>

<style>

body{
    height:100vh;
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(lightpink, hotpink);
}
.card{
    background:white;

    padding:40px;

    border-radius:20px;

    text-align:center;

    box-shadow:0 10px 30px rgba(0,0,0,0.3);

    max-width:400px;
}
h1{
    font-size:42px;

    margin-bottom:15px;

    color:deeppink;

    animation:glow 1.5s infinite alternate;
}
@keyframes glow{

    from{
        text-shadow:
        0 0 10px pink,
        0 0 20px deeppink,
        0 0 30px hotpink;
    }

    to{
        text-shadow:
        0 0 20px deeppink,
        0 0 40px hotpink,
        0 0 60px pink;
    }

}
p{
    color:purple;

    font-size:20px;

    margin-bottom:25px;

    line-height:1.5;
}
.btn{
    display:inline-block;

    padding:12px 25px;

    background:deeppink;

    color:white;

    text-decoration:none;

    border-radius:30px;

    font-weight:bold;
}

</style>

</head>

<body>

<div class="card">

    <h1>🎂 Happy Birthday Archuu 🎉</h1>

    <p>
        May your life ahead be filled with happiness,
        love, and endless beautiful memories.
    </p>

    <a href="https://www.swiggy.com/city/vizag/ibaco-murali-nagar-n-a-d-rest921114" class="btn"> party</a>

</div>

</body>
</html>
